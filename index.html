<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Fashion Shop - Trang chủ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header sẽ được JS tự động chèn vào đây -->

    <section class="hero-chuyen">
        <div id="bang-chuyen">
            <div class="slide" onclick="document.getElementById('bo-suu-tap-1').scrollIntoView({behavior: 'smooth'})" style="background-image: url('km/km1.png');"></div>
            <div class="slide" onclick="document.getElementById('bo-suu-tap-2').scrollIntoView({behavior: 'smooth'})" style="background-image: url('km/km2.png');"></div>
            <div class="slide" onclick="document.getElementById('bo-suu-tap-3').scrollIntoView({behavior: 'smooth'})" style="background-image: url('km/km3.png');"></div>
        </div>
        <button id="nut-lui" aria-label="Ảnh trước">❮</button>
        <button id="nut-toi" aria-label="Ảnh sau">❯</button>
        <div id="cham-chuyen" class="cham-chuyen"></div>
    </section>

    <div class="thanh-doi-tra">
        🔄 Không hài lòng, đổi trả trong 30 ngày <a href="#">Xem chính sách ↗</a>
    </div>

    <!-- BỘ SƯU TẬP 1 -->
    <div id="bo-suu-tap-1" class="phan-cach-khu-vuc"><h2>BỘ SƯU TẬP MỚI</h2></div>
    <div class="khung-banner">
        <img src="km/km4.png" alt="Banner Khuyến Mãi 4">
    </div>
    <main class="khu-san-pham">
        <div class="danh-sach-san-pham" id="khu-vuc-sp-1"></div>
    </main>

    <!-- BỘ SƯU TẬP 2 -->
    <div id="bo-suu-tap-2" class="phan-cach-khu-vuc"><h2>Ưu đãi tựu trường</h2></div>
    <div class="khung-banner">
        <img src="km/km5.png" alt="Banner Khuyến Mãi 5">
    </div>
    <main class="khu-san-pham">
        <div class="danh-sach-san-pham" id="khu-vuc-sp-2"></div>
    </main>

    <!-- BỘ SƯU TẬP 3 -->
    <div id="bo-suu-tap-3" class="phan-cach-khu-vuc"><h2>Thoáng mát - Năng động</h2></div>
    <div class="khung-banner">
        <img src="km/km6.png" alt="Banner Khuyến Mãi 6">
    </div>
    <main class="khu-san-pham khu-san-pham-cuoi">
        <div class="danh-sach-san-pham" id="khu-vuc-sp-3"></div>
    </main>

    <!-- Footer và Các cửa sổ nổi sẽ được JS tự động chèn vào đây -->
    <script src="script.js"></script>
</body>
</html>
