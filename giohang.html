<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ Hàng Của Bạn - Fashion Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header sẽ được JS tự động chèn vào đây -->

    <main>
        <div class="khu-vuc-thanh-toan">
            <h2 class="tieu-de-gio-hang">GIỎ HÀNG CỦA BẠN <span id="so-san-pham-gio" class="so-san-pham-gio"></span></h2>

            <div id="thanh-freeship" class="thanh-freeship">
                <div id="freeship-chu" class="freeship-chu"></div>
                <div class="freeship-nen"><div id="freeship-tien" class="freeship-tien"></div></div>
            </div>

            <div class="thanh-tieu-de-gio gio-luoi">
                <div class="gio-o-chon"><input type="checkbox" id="check-all" class="hop-checkbox" title="Chọn tất cả"></div>
                <div><span class="chu-dai">Sản phẩm</span><span class="chu-ngan">Chọn tất cả</span></div>
                <div class="gio-o-gia">Đơn giá</div>
                <div class="gio-o-sl">Số lượng</div>
                <div class="gio-o-tien">Thành tiền</div>
                <div class="gio-o-xoa"></div>
            </div>

            <div id="danh-sach-mua"></div>

            <div class="gio-thanh-thanh-toan">
                <div class="tong-ket-gio">
                    <span class="chu-tong">Tổng cộng <small id="so-mon-chon"></small></span>
                    <span class="so-tong"><span id="tong-tien">0</span> VNĐ</span>
                </div>

                <div class="khu-vuc-nut-mua">
                    <a href="index.html" class="nut-quay-lai">🔙 Tiếp tục mua sắm</a>
                    <button id="nut-thanh-toan" class="nut-thanh-toan-moi">💳 Thanh toán ngay</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer và Các cửa sổ nổi sẽ được JS tự động chèn vào đây -->
    <script src="script.js"></script>
</body>
</html>
