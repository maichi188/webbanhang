<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thanh Toán - Fashion Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header sẽ được JS tự động chèn vào đây -->

    <nav class="cac-buoc" aria-label="Các bước đặt hàng">
        <a href="giohang.html" class="buoc da-xong"><span class="buoc-so">✓</span><span>Giỏ hàng</span></a>
        <span class="buoc-noi da-xong"></span>
        <div class="buoc hien-tai"><span class="buoc-so">2</span><span>Thanh toán</span></div>
        <span class="buoc-noi"></span>
        <div class="buoc"><span class="buoc-so">3</span><span>Hoàn tất</span></div>
    </nav>

    <main class="layout-thanh-toan">
        <div class="khung-thong-tin">
            <h2 class="tieu-de-form">📝 Thông Tin Giao Hàng</h2>
            <input type="text" id="ten-khach-hang" class="form-nhap" placeholder="Họ và tên người nhận (*)" autocomplete="name" aria-label="Họ và tên người nhận">
            <div class="loi-o"></div>
            <input type="tel" id="sdt-khach-hang" class="form-nhap" placeholder="Số điện thoại (*)" autocomplete="tel" inputmode="tel" aria-label="Số điện thoại">
            <div class="loi-o"></div>
            <input type="text" id="dia-chi-khach-hang" class="form-nhap" placeholder="Địa chỉ nhận hàng (Số nhà, Phường/Xã, Quận/Huyện, Tỉnh/TP) (*)" autocomplete="street-address" aria-label="Địa chỉ nhận hàng">
            <div class="loi-o"></div>
            <textarea id="ghi-chu-khach-hang" class="form-nhap" rows="3" placeholder="Ghi chú thêm cho shipper (Không bắt buộc)" aria-label="Ghi chú cho shipper"></textarea>

            <h2 class="tieu-de-form tieu-de-form-thu-hai">💳 Phương Thức Thanh Toán</h2>
            <label class="phuong-thuc-tt">
                <input type="radio" name="pttt" value="Thanh toán khi nhận hàng (COD)" checked> 
                <b>Thanh toán khi nhận hàng (COD)</b>
            </label>
            <label class="phuong-thuc-tt phuong-thuc-tat" id="the-chuyen-khoan">
                <input type="radio" name="pttt" value="Chuyển khoản qua Ngân hàng (Mã QR)" disabled> 
                <b>Chuyển khoản qua Ngân hàng (Mã QR)</b>
                <span class="nhan-chua-ho-tro">Tạm thời chưa hỗ trợ</span>
            </label>
        </div>

        <div class="khung-don-hang">
            <h2 class="tieu-de-form">🛒 Đơn Hàng Của Bạn</h2>
            <div id="danh-sach-thanh-toan"></div>
            <div class="dong-van-chuyen">
                <span>Phí vận chuyển:</span>
                <b id="gia-tri-van-chuyen">Miễn phí</b>
            </div>
            <div id="goi-y-freeship" class="goi-y-freeship"></div>
            <div class="dong-tong-tien">
                <span>Tổng thanh toán:</span>
                <span class="so-tien-tong"><span id="tong-tien-thanh-toan">0</span> đ</span>
            </div>
            <button id="nut-xac-nhan-dat-hang">ĐẶT HÀNG NGAY</button>
            <div class="ghi-chu-bao-mat">🔒 Thông tin của bạn được bảo mật tuyệt đối</div>
            <div class="lien-ket-quay-lai">
                <a href="giohang.html">← Quay lại giỏ hàng</a>
            </div>
        </div>
    </main>

    <!-- Footer và Các cửa sổ nổi sẽ được JS tự động chèn vào đây -->
    <script src="script.js"></script>
</body>
</html>
